<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Smart Waste Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;
             background:linear-gradient(135deg,#E8F5E9 0%,#C8E6C9 100%);overflow:hidden;color:#1E293B}
        .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
        .particle{position:absolute;border-radius:50%;opacity:.3;animation:float 8s infinite ease-in-out}
        .particle:nth-child(1){width:300px;height:300px;background:radial-gradient(circle,#4CAF50,transparent);top:10%;left:-5%;animation-delay:0s}
        .particle:nth-child(2){width:200px;height:200px;background:radial-gradient(circle,#2E7D32,transparent);top:60%;right:-3%;animation-delay:2s}
        .particle:nth-child(3){width:250px;height:250px;background:radial-gradient(circle,#FFA000,transparent);bottom:-5%;left:30%;animation-delay:4s}
        @keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-30px) scale(1.05)}}
        .login-container{position:relative;z-index:1;width:100%;max-width:460px;padding:20px}
        .login-card{background:#FFFFFF;border:1px solid rgba(46,125,50,0.1);
                    border-radius:32px;padding:48px 40px;box-shadow:0 16px 40px rgba(46,125,50,0.16)}
        .brand{text-align:center;margin-bottom:36px}
        .brand-icon{width:72px;height:72px;background:linear-gradient(135deg,#4CAF50,#2E7D32);border-radius:24px;
                    display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;
                    box-shadow:0 8px 24px rgba(76,175,80,0.3)}
        .brand-icon i{font-size:32px;color:#fff}
        .brand h1{font-size:1.5rem;font-weight:800;color:#1E293B;letter-spacing:-0.5px}
        .brand p{font-size:.85rem;color:#475569;margin-top:6px;line-height:1.5;font-weight:500;}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:.78rem;font-weight:700;color:#1E293B;
                          margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
        .input-wrap{position:relative}
        .input-wrap i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#94A3B8;font-size:1rem}
        .input-wrap input{width:100%;padding:14px 16px 14px 48px;background:#F8FAFC;
                          border:2px solid #E2E8F0;border-radius:9999px;color:#1E293B;font-size:.95rem;
                          font-family:'Plus Jakarta Sans',sans-serif;transition:all .3s;font-weight:500;}
        .input-wrap input:focus{outline:none;border-color:#4CAF50;background:#FFFFFF;
                                box-shadow:0 4px 12px rgba(76,175,80,0.1)}
        .input-wrap input::placeholder{color:#94A3B8}
        .login-btn{width:100%;padding:16px;background:linear-gradient(135deg,#4CAF50,#2E7D32);border:none;
                   border-radius:9999px;color:#fff;font-size:1rem;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;
                   cursor:pointer;transition:all .3s;margin-top:8px;letter-spacing:.5px;
                   box-shadow:0 8px 24px rgba(76,175,80,0.25)}
        .login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(76,175,80,0.35)}
        .login-btn:active{transform:translateY(0)}
        .error-msg{background:#FFF3E0;border:1px solid #FFA000;border-radius:16px;
                   padding:12px 16px;color:#E65100;font-size:.85rem;margin-bottom:20px;text-align:center;font-weight:600;}
        .demo-creds{text-align:center;margin-top:24px;padding-top:20px;border-top:1px solid #E2E8F0}
        .demo-creds p{font-size:.8rem;color:#64748B}
        .demo-creds span{color:#2E7D32;font-weight:700}
    </style>
</head>
<body>
    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    </div>
    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-leaf"></i></div>
                <h1>EcoCivic Waste Management</h1>
                <p>Municipal Operations Platform</p>
            </div>
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="error-msg"><i class="fas fa-exclamation-circle"></i> {{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrap">
                        <i class="fas fa-user"></i>
                        <input type="text" name="username" placeholder="Enter username" autocomplete="off" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrap">
                        <i class="fas fa-lock"></i>
                        <input type="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>
                <button type="submit" class="login-btn"><i class="fas fa-sign-in-alt"></i> &nbsp;Access Dashboard</button>
            </form>
            <div class="demo-creds">
                <p>Demo Credentials: <span>manager</span> / <span>manager123</span></p>
            </div>
        </div>
    </div>
</body>
</html>
